name: build
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      filter: ${{ steps.filter.outputs.demo == 'true' || steps.filter.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - uses: dorny/paths-filter@4512585405083f25c027a35db413c2b3b9006d50 # v2.11.1
        id: filter
        with:
          filters: .github/filters.yml
  demo:
    needs: filter
    if: ${{ needs.filter.outputs.filter == 'true' }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [12.x]

    steps:
      - name: Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0

      - name: Install dfx
        uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365 # main
        with:
          dfx-version: "0.9.2"

      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Demo
        run: sh demo.sh

  aggregate:
    name: demo:required
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [demo, filter]
    steps:
    - name: Check demo result
      if: ${{ needs.demo.result != 'success' && needs.filter.outputs.filter == 'true' }}
      run: exit 1
